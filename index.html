<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GetKey Menu</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #1b1f27;
      padding: 25px;
      border-radius: 15px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .avatar {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg,#4e9af1,#7b60ff);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      margin: auto;
      font-size: 20px;
    }
    h2 {
      margin-top: 15px;
    }
    input, .output {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 14px;
    }
    input {
      background: #2a2f3a;
      color: #ccc;
    }
    .output {
      background: #15191f;
      color: #00ffcc;
      font-weight: bold;
    }
    .btn {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }
    .btn-primary {
      background: #2196f3;
      color: white;
    }
    .btn-danger {
      background: #444;
      color: white;
    }
    .btn:hover {
      opacity: 0.8;
    }
    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">GK</div>
    <h2>GetKey Menu</h2>
    <p>Lấy đường link từ website GetKey ở đây dán vào để xuất key.</p>
    <input type="text" placeholder="Ví dụ: https://example.github.io" id="urlInput">

    <button class="btn btn-primary" onclick="generateKey()">Xuất key</button>
    <button class="btn btn-danger" onclick="clearKey()">Xóa</button>

    <div class="output" id="keyOutput">Key sẽ xuất hiện ở đây</div>
    <button class="btn btn-primary" onclick="copyKey()">Sao chép</button>

    <div class="footer">Copyright © TungAPI.vn</div>
  </div>

  <script>
    function generateKey() {
      let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      let key = "";
      for (let i = 0; i < 20; i++) {
        key += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById("keyOutput").innerText = key;
    }

    function clearKey() {
      document.getElementById("keyOutput").innerText = "Key sẽ xuất hiện ở đây";
    }

    function copyKey() {
      let key = document.getElementById("keyOutput").innerText;
      navigator.clipboard.writeText(key);
      alert("Đã sao chép key: " + key);
    }
  </script>
</body>
</html>
